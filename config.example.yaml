# Example Goroker configuration.
#
# Copy this to ~/.goroker/config.yaml and fill in the brokerage URLs.
# It must never contain a username, password, OTP, cookie or token.
# Every value here can be overridden by an environment variable, for example
# GOROKER_WATCH_INTERVAL=5s or GOROKER_BROWSER_HEADLESS=true.

broker:
  # Adapter to use. "mofid" is the adapter in internal/broker/mofid.
  name: mofid
  # Name shown by `goroker status`.
  display_name: Mofid Easy Trader
  base_url: "https://d.easytrader.ir/"
  # Left empty until broker discovery establishes the login entry point; the
  # adapter then looks for the login form on the base URL.
  login_url: ""
  trading_url: "https://d.easytrader.ir/"

browser:
  # Trading interaction should be visible. Keep this false.
  headless: false
  # Leave empty to let Rod find Chromium, or pin a binary path.
  bin_path: ""
  # Bounds a single browser operation.
  timeout: 30s
  # Adds a delay between browser actions; useful while developing.
  slow_motion: 0s
  # How long Goroker waits while you complete an OTP/CAPTCHA/device challenge.
  manual_challenge_timeout: 5m

watch:
  # How often the live quote is read. Keep this gentle.
  interval: 2s
  # The oldest a quote may be and still support a trading decision.
  max_quote_age: 5s

order:
  # How long the confirmation prompt stays valid before it expires.
  confirmation_timeout: 15s

logging:
  level: info
  format: text

debug:
  # Save a screenshot when UI automation fails, under ~/.goroker/debug/.
  screenshots: true
